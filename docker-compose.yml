version: '3.8'

services:

  # CricCircle AI Service
  ai_service:
    build: .
    container_name: criccircle_ai
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - S3_BUCKET_RAW_VIDEOS=${S3_BUCKET_RAW_VIDEOS}
      - S3_BUCKET_HIGHLIGHTS=${S3_BUCKET_HIGHLIGHTS}
      - NESTJS_BACKEND_URL=${NESTJS_BACKEND_URL}
      - NESTJS_WEBHOOK_SECRET=${NESTJS_WEBHOOK_SECRET}
      - USE_GPU=false
    volumes:
      - ./models:/app/models
      - ./assets:/app/assets
      - ./logs:/app/logs
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - criccircle_network

  # Redis (shared with NestJS)
  redis:
    image: redis:7-alpine
    container_name: criccircle_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - criccircle_network

volumes:
  redis_data:

networks:
  criccircle_network:
    external: true
